name: tryll-release

# Builds espeak-free (SHERPA_ONNX_TTS_WITHOUT_ESPEAK=ON) Windows x64 packages
# and uploads them as GitHub Release assets. Consumed by
# tryll-mono/tryll/cmake/TryllSherpaOnnx.cmake.
#
# Package names are derived from the git tag (e.g. v1.13.2-tryll.1):
#   sherpa-onnx-<tag>-win-x64-shared-MD-Release.tar.bz2
#   sherpa-onnx-<tag>-win-x64-cuda.tar.bz2
#   sherpa-onnx-<tag>-osx-arm64-shared.tar.bz2   (macOS 14+, Apple Silicon; from v1.13.2-tryll.2)
#
# Never re-run or move a published tag: tryll-mono pins each asset by SHA-256.
# Uploads use overwrite: false, so a re-run cannot replace a pinned asset.

on:
  push:
    tags:
      - 'v*-tryll.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tryll-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: win-x64 ${{ matrix.pkg }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - pkg: cpu
            suffix: shared-MD-Release
          - pkg: cuda
            suffix: cuda
            # Same onnxruntime-gpu version v1.13.2's windows-x64-cuda leg uses
            # for the plain win-x64-cuda package name.
            onnxruntime_version: "1.17.1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake (CPU)
        if: matrix.pkg == 'cpu'
        shell: bash
        run: |
          mkdir build
          cd build
          cmake \
            -A x64 \
            -D CMAKE_BUILD_TYPE=Release \
            -D BUILD_SHARED_LIBS=ON \
            -D SHERPA_ONNX_ENABLE_TTS=ON \
            -D SHERPA_ONNX_TTS_WITHOUT_ESPEAK=ON \
            -D SHERPA_ONNX_USE_STATIC_CRT=OFF \
            -D SHERPA_ONNX_ENABLE_PORTAUDIO=OFF \
            -D CMAKE_INSTALL_PREFIX=./install \
            ..

      - name: Configure CMake (CUDA)
        if: matrix.pkg == 'cuda'
        shell: bash
        run: |
          onnxruntime_version=${{ matrix.onnxruntime_version }}
          curl -SL -O https://github.com/microsoft/onnxruntime/releases/download/v$onnxruntime_version/onnxruntime-win-x64-gpu-$onnxruntime_version.zip
          unzip -q onnxruntime-win-x64-gpu-$onnxruntime_version.zip

          export SHERPA_ONNXRUNTIME_LIB_DIR=$PWD/onnxruntime-win-x64-gpu-$onnxruntime_version/lib
          export SHERPA_ONNXRUNTIME_INCLUDE_DIR=$PWD/onnxruntime-win-x64-gpu-$onnxruntime_version/include

          mkdir build
          cd build
          cmake \
            -A x64 \
            -D CMAKE_BUILD_TYPE=Release \
            -D BUILD_SHARED_LIBS=ON \
            -D SHERPA_ONNX_ENABLE_TTS=ON \
            -D SHERPA_ONNX_TTS_WITHOUT_ESPEAK=ON \
            -D SHERPA_ONNX_ENABLE_GPU=ON \
            -D SHERPA_ONNX_ENABLE_PORTAUDIO=OFF \
            -D CMAKE_INSTALL_PREFIX=./install \
            ..

      - name: Build
        shell: bash
        run: |
          cd build
          cmake --build . --config Release -- -m:2
          cmake --build . --config Release --target install -- -m:2

      - name: Package
        shell: bash
        run: |
          # For workflow_dispatch test runs GITHUB_REF_NAME is the branch name;
          # the package is still built and scanned, just not release-named.
          tag=${GITHUB_REF_NAME//\//-}
          dst=sherpa-onnx-${tag}-win-x64-${{ matrix.suffix }}

          mkdir $dst
          cp -a build/install/bin $dst/
          cp -a build/install/lib $dst/
          cp -a build/install/include $dst/

          rm -rf $dst/lib/pkgconfig
          rm -f $dst/lib/cargs.dll $dst/lib/cargs.lib $dst/include/cargs.h

          ls -lh $dst/lib/
          tar cjvf ${dst}.tar.bz2 $dst

      - name: eSpeak license gate
        shell: bash
        run: |
          python - <<'EOF'
          import glob
          import sys

          markers = [b"espeak_Initialize", b"espeak_TextToPhonemes", b"espeak-ng-data"]
          # DLLs only: the demo exes' --help text mentions espeak-ng-data as a
          # plain string, and only the DLLs are redistributed by tryll.
          files = sorted(glob.glob("sherpa-onnx-*/**/*.dll", recursive=True))
          # Do not scan the downloaded onnxruntime SDK dir, only the package.
          files = [f for f in files if not f.startswith("onnxruntime-")]
          if not files:
              sys.exit("FAIL: no packaged DLL/EXE files found to scan")

          bad = False
          for path in files:
              with open(path, "rb") as f:
                  data = f.read()
              for m in markers:
                  if m in data:
                      print(f"HIT {m.decode()} in {path}")
                      bad = True
              print(f"scanned {path}")

          if bad:
              sys.exit("FAIL: eSpeak markers found in packaged binaries")
          print("PASS: package is espeak-free")
          EOF

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: sherpa-onnx-win-x64-${{ matrix.suffix }}
          path: sherpa-onnx-*-win-x64-*.tar.bz2

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: svenstaro/upload-release-action@v2
        with:
          file_glob: true
          overwrite: false
          file: sherpa-onnx-*-win-x64-*.tar.bz2
          repo_token: ${{ secrets.GITHUB_TOKEN }}

  build-macos-arm64:
    name: osx-arm64 shared (espeak-free)
    runs-on: macos-26
    permissions:
      contents: write
    env:
      # Tag runs use the tag; workflow_dispatch runs build under the next tag name.
      TRYLL_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.13.2-tryll.2' }}
      ORT_LIB: libonnxruntime.1.24.4.dylib
      MIN_OS: "14.0"
      # Same markers as the Windows legs' gate.
      MARKERS: "espeak_Initialize|espeak_TextToPhonemes|espeak-ng-data"
    steps:
      - name: Refuse the tryll.1 tag
        if: github.ref_name == 'v1.13.2-tryll.1'
        shell: bash
        run: |
          echo "::error::Never re-run v1.13.2-tryll.1: it would replace the pinned Windows tarballs. Use v1.13.2-tryll.2."
          exit 1

      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build \
            -D CMAKE_BUILD_TYPE=Release \
            -D CMAKE_OSX_ARCHITECTURES=arm64 \
            -D CMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -D CMAKE_INSTALL_PREFIX="$PWD/build/install" \
            -D BUILD_SHARED_LIBS=ON \
            -D SHERPA_ONNX_ENABLE_TTS=ON \
            -D SHERPA_ONNX_TTS_WITHOUT_ESPEAK=ON \
            -D SHERPA_ONNX_ENABLE_PORTAUDIO=OFF \
            -D SHERPA_ONNX_ENABLE_BINARY=OFF \
            -D SHERPA_ONNX_ENABLE_PYTHON=OFF \
            -D SHERPA_ONNX_ENABLE_TESTS=OFF \
            -D SHERPA_ONNX_ENABLE_CHECK=OFF \
            -D SHERPA_ONNX_ENABLE_WEBSOCKET=OFF \
            -D SHERPA_ONNX_ENABLE_JNI=OFF \
            -D SHERPA_ONNX_ENABLE_GPU=OFF \
            -D SHERPA_ONNX_ENABLE_C_API=ON \
            -D SHERPA_ONNX_BUILD_C_API_EXAMPLES=OFF

      - name: Build and install
        shell: bash
        run: |
          cmake --build build --config Release -j "$(sysctl -n hw.ncpu)"
          cmake --install build --config Release

      - name: Licence gate (no eSpeak / piper code in any dylib)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          libs=(build/install/lib/*.dylib)
          if [ ${#libs[@]} -eq 0 ]; then
            echo "::error::No *.dylib under build/install/lib; the gate has nothing to scan."
            exit 1
          fi
          fail=0
          for f in "${libs[@]}"; do
            [ -L "$f" ] && continue
            echo "scan $f"
            if strings -a "$f" | grep -E -q "$MARKERS"; then
              echo "::error::GPL eSpeak/piper marker found in $f"
              strings -a "$f" | grep -E "$MARKERS" | head -n 20
              fail=1
            fi
          done
          exit $fail

      - name: Check dylibs (arch, min OS, install names, rpath)
        shell: bash
        run: |
          set -euo pipefail
          lib=build/install/lib
          c="$lib/libsherpa-onnx-c-api.dylib"
          ort="$lib/$ORT_LIB"
          for f in "$c" "$ort"; do
            if [ ! -f "$f" ] || [ -L "$f" ]; then
              echo "::error::$f is missing or a symlink"; exit 1
            fi
          done

          minos() {
            otool -l "$1" | awk '
              /LC_BUILD_VERSION/ {b=1}
              b && $1=="minos" {print $2; exit}
              /LC_VERSION_MIN_MACOSX/ {v=1}
              v && $1=="version" {print $2; exit}'
          }
          for f in "$c" "$ort"; do
            archs="$(lipo -archs "$f")"
            if [ "$archs" != "arm64" ]; then
              echo "::error::$f archs '$archs' (want arm64 only)"; exit 1
            fi
            m="$(minos "$f")"
            if [ "$(printf '%s\n%s\n' "$m" "$MIN_OS" | sort -V | tail -n1)" != "$MIN_OS" ]; then
              echo "::error::$f minos $m is above $MIN_OS"; exit 1
            fi
            echo "$f: archs=$archs minos=$m id=$(otool -D "$f" | tail -n1)"
          done

          # The C API may depend on system libraries and the versioned ORT only.
          self_id="$(otool -D "$c" | tail -n1)"
          otool -L "$c"
          bad=0
          while read -r dep _; do
            case "$dep" in
              "$self_id"|/usr/lib/*|/System/*) ;;
              "@rpath/$ORT_LIB") ;;
              *) echo "::error::unexpected dependency of $c: $dep"; bad=1 ;;
            esac
          done < <(otool -L "$c" | tail -n +2)
          [ $bad -eq 0 ]
          if ! otool -L "$c" | grep -q "@rpath/$ORT_LIB"; then
            echo "::error::$c does not load @rpath/$ORT_LIB"; exit 1
          fi

          # Tryll stages both files side by side and relies on @loader_path.
          if ! otool -l "$c" | grep -A2 LC_RPATH | grep -q "path @loader_path "; then
            install_name_tool -add_rpath @loader_path "$c"
            codesign --force --sign - "$c"
          fi
          otool -l "$c" | grep -A2 LC_RPATH

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          dst="sherpa-onnx-${TRYLL_TAG}-osx-arm64-shared"
          rm -rf "$dst" "$dst.tar.bz2"
          mkdir -p "$dst/lib" "$dst/include" "$dst/licenses"
          cp build/install/lib/libsherpa-onnx-c-api.dylib "$dst/lib/"
          cp "build/install/lib/$ORT_LIB" "$dst/lib/"
          cp -R build/install/include/sherpa-onnx "$dst/include/"
          test -f "$dst/include/sherpa-onnx/c-api/c-api.h"
          cp LICENSE "$dst/LICENSE"

          ort_lic="$(find build/_deps -maxdepth 3 -path '*onnxruntime*' -name LICENSE -print -quit)"
          ort_tpn="$(find build/_deps -maxdepth 3 -path '*onnxruntime*' -name ThirdPartyNotices.txt -print -quit)"
          if [ -z "$ort_lic" ]; then
            echo "::error::ONNX Runtime LICENSE not found under build/_deps"; exit 1
          fi
          cp "$ort_lic" "$dst/licenses/onnxruntime-LICENSE"
          if [ -n "$ort_tpn" ]; then
            cp "$ort_tpn" "$dst/licenses/onnxruntime-ThirdPartyNotices.txt"
          fi

          tar cjf "$dst.tar.bz2" "$dst"
          shasum -a 256 "$dst.tar.bz2" | tee "$dst.tar.bz2.sha256"
          {
            echo "### $dst.tar.bz2"
            echo '```'
            cat "$dst.tar.bz2.sha256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: sherpa-onnx-osx-arm64-shared
          path: |
            sherpa-onnx-*-osx-arm64-shared.tar.bz2
            sherpa-onnx-*-osx-arm64-shared.tar.bz2.sha256
          retention-days: 7

      # Releases only on a tag run. overwrite: false so a re-run can never replace
      # a published (pinned) asset.
      - name: Upload to the tag's release
        if: github.ref_type == 'tag'
        uses: svenstaro/upload-release-action@v2
        with:
          file: sherpa-onnx-*-osx-arm64-shared.tar.bz2
          file_glob: true
          tag: ${{ github.ref_name }}
          overwrite: false
